[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ypuddin"
version = "0.1.0"
description = "YPuddin Train Studio - a modular diffusion LoRA/LoKr trainer (Anima-first) with a service API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "YPuddin Train Studio contributors" }]
keywords = ["diffusion", "lora", "lokr", "lycoris", "anima", "training"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pillow>=10.0",
    "safetensors>=0.4",
    "pydantic>=2.6",
    "einops>=0.7",
    "tomli-w>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Model loading for real families (Qwen3 tokenizer/text encoder, HF hub).
models = [
    "transformers>=4.51",
    "huggingface-hub>=0.25",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
]
# HTTP service used by the frontend.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]
# CUDA-only accelerators; never imported unconditionally.
cuda = [
    "bitsandbytes>=0.43",
    "nvidia-ml-py>=12.0",
]
# Extra optimizers.
optim = [
    "prodigyopt>=1.0",
    "prodigy-plus-schedulefree>=2.0",
    "pytorch-optimizer>=3.0",
]
logging = [
    "tensorboard>=2.16",
    "wandb>=0.17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
ypuddin = "ypuddin.cli:main"

[tool.setuptools.packages.find]
include = ["ypuddin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
